# Meeti — production stack: Postgres + API with a persistent uploads volume.
# Usage:  docker compose -f docker-compose.prod.yml up -d --build
# Secrets live in apps/api/.env on the server (that file is gitignored).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meeting_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-creates tables on first boot (only when pgdata is empty)
      - ./packages/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - apps/api/.env
    environment:
      # Override the localhost DB host so the container talks to the postgres service
      DB_HOST: postgres
      DB_PORT: "5432"
      NODE_ENV: production
    ports:
      # Bind to loopback only. Caddy reaches the API over the internal Docker
      # network (reverse_proxy api:3000), so the API never needs a public host
      # binding. Publishing 0.0.0.0:3000 exposed the raw, unencrypted API to the
      # whole internet (bypassing TLS/Caddy). 127.0.0.1 keeps local health
      # checks (curl localhost:3000) working while closing that hole.
      - "127.0.0.1:3000:3000"
    volumes:
      # Persist recorded audio so transcription can read it back
      - uploads:/repo/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile: automatic HTTPS (Let's Encrypt) for api.meeti.org.uk -> api:3000
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certs + config across restarts
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
