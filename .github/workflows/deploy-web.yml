name: Deploy Web (Cloudflare Workers)

# Push to the production branch auto-deploys the web app to meeti.org.uk.
# A failing build/test blocks the deploy. Rollback: re-run with a previous
# commit (workflow_dispatch) or `wrangler rollback` in Cloudflare.
#
# Required GitHub Secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - Cloudflare API token scoped to Workers Scripts (Edit)
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account ID

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy web
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_API_URL: https://api.meeti.org.uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Deploy gate: the whole monorepo must compile and tests must pass first.
      - name: Type-check, build and test
        run: npm run build && npm test

      - name: Build OpenNext bundle
        working-directory: apps/web
        run: npx opennextjs-cloudflare build

      - name: Verify required secrets are configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set. Add them to enable auto-deploy."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Record deployed version
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "Deployed commit $COMMIT_SHA to meeti.org.uk" >> "$GITHUB_STEP_SUMMARY"
